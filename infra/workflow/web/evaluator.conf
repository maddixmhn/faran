server {
    listen 80;
    root /usr/share/nginx/html;
    location = /core.mjs { types { application/javascript mjs; } }
    location = /api/runtime-summary {
        proxy_pass http://runtime-summary:8080;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
    }
    location / { try_files $uri $uri/ =404; }
}
